name: Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [ master, windows-install ]
  pull_request:

# Pinned xTB conda-forge win-64 runtime (design D2). Each entry records the
# exact artifact filename and its sha256 digest; a digest mismatch fails the
# build. The xtb root pins to 6.7.1; the remaining entries are the first-level
# DLL imports of libxtb-6.dll resolved from the conda-forge win-64 repodata at
# pin time. Artifacts are downloaded from conda.anaconda.org, with
# repo.conda-forge.org (the canonical host) as a fallback for the rare storage
# inconsistency where a listed object is momentarily absent.
env:
  XTB_ARTIFACTS: |
    [
      {"pkg":"libxtb-6","fn":"xtb-6.7.1-gfortran_hca11032_5.conda","sha256":"a00b7ab9b5eea26780ba16a2fe54c525b23ef118ccd331ab4ed772f22fa4ffec"},
      {"pkg":"libtblite-0","fn":"tblite-0.6.0-gfortran_hca11032_0.conda","sha256":"f65b1302b7f98cb0200157f6e4eee8bd024b7f3c42d45057a37d1aad58482905"},
      {"pkg":"libdftd4-4","fn":"dftd4-4.2.0-gfortran_hca11032_1.conda","sha256":"a5192a616cb1c6d09e58a9e939c33eaeb34ff8bda74f540e39d0c495f926bb26"},
      {"pkg":"libmctc-lib-0","fn":"mctc-lib-0.5.2-gfortran_hee28707_0.conda","sha256":"38e0ec93423d211d9cff9cf6832bd2b79172805bd27a59da599d3fe8df74b02d"},
      {"pkg":"libmulticharge-0","fn":"multicharge-0.5.0-gfortran_hd04652a_3.conda","sha256":"338d34851a03b7fa5dcaa3ca5fdc90f8f1514e1bc7f452d8ff36642abc8e43e9"},
      {"pkg":"libcpx-1","fn":"cpcm-x-1.1.0-gfortran_hca11032_1.conda","sha256":"2e6788bcbaf3157be285b39d9d4795d5d09f98b0aec6ff885e9b03c6b82ea895"},
      {"pkg":"libblas","fn":"libblas-3.11.0-12_h0adab6e_openblas.conda","sha256":"e019adbf481a7b84de39b535a9dd4beafcb2afad772a5f34d7bf6b360d90e9ee"},
      {"pkg":"liblapack","fn":"liblapack-3.11.0-12_hd232482_openblas.conda","sha256":"2cd61d177472f91a50087c07a44609086fc3aa5f18b7b4c49f3bb487117fa2b9"},
      {"pkg":"libgcc","fn":"libgcc-16.2.0-h110b43a_7.conda","sha256":"59feb6d16cba13a70f22dae70a44670eb2cc45e652e9a34a014814c2ca871132"},
      {"pkg":"libgfortran-5","fn":"libgfortran5-16.2.0-h7c9de5e_7.conda","sha256":"e9b86fe14cb9938abd08f0b1685b04457339f71d9f00783fe9258a1eb0229963"},
      {"pkg":"libgomp-1","fn":"libgomp-16.2.0-h8ee18e1_7.conda","sha256":"4b8a747f047d069ccd2a6cf2f4fdbc6b0c0e4dcd840998d1fe607b8c234e707b"},
      {"pkg":"libwinpthread-1","fn":"libwinpthread-12.0.0.r4.gg4f2fc60ca-h57928b3_10.conda","sha256":"0fccf2d17026255b6e10ace1f191d0a2a18f2d65088fd02430be17c701f8ffe0"},
      {"pkg":"libopenblas","fn":"libopenblas-0.3.34-pthreads_h952cde7_2.conda","sha256":"138056f68cf8f92cb1830fe1ed950d70856cc840f5f4b2569f9e849cb109bf7e"},
      {"pkg":"libs-dftd3-1","fn":"simple-dftd3-1.4.0-gfortran_hee28707_1.conda","sha256":"af232186e15e31c405f860955eaf7f752f9bff24df6a507a7ba8a391419507f1"},
      {"pkg":"libtoml-f-0","fn":"toml-f-0.5.2-gfortran_hee28707_0.conda","sha256":"3516b3ec07c7ec1d41e020c6451b7c42f474f439547892b12872c2b6632ff2e6"},
      {"pkg":"libnumsa-0","fn":"numsa-0.2.0-gfortran_hee28707_2.conda","sha256":"e8ccd69b93b0d73d87983813cd158273e8cdd5f72918590fa7cebf0f860a5534"}
    ]

jobs:
  build-installer:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [installer, tests]
    steps:
      - name: Allow Windows reserved filenames
        run: git config --system core.protectNTFS false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: choco install -y cmake --version=3.28.6 `
          --no-progress `
          --installargs '"ADD_CMAKE_TO_PATH=System"' `
          --allow-downgrade   # harmless if no newer CMake is present
      - name: Install NSIS
        run: choco install -y nsis --no-progress
      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path $nsis)) {
            Write-Error "NSIS not found at $nsis after installation"
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build zlib
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ver = '1.3.2'
          $zip = Join-Path $env:RUNNER_TEMP "zlib-$ver.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "zlib-$ver-src"
          $zlibArchive = "zlib$($ver -replace '\.', '').zip"
          $urls = @(
            "https://zlib.net/$zlibArchive",
            "https://github.com/madler/zlib/releases/download/v$ver/$zlibArchive",
            "https://github.com/madler/zlib/archive/refs/tags/v$ver.zip"
          )

          Write-Host "zlib version: $ver"
          Write-Host "Downloaded file path: $zip"
          Write-Host "Extraction directory: $extractRoot"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $downloaded = $false
          foreach ($url in $urls) {
            Write-Host "Trying zlib download URL: $url"
            Remove-Item -Path $zip -Force -ErrorAction SilentlyContinue
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip

              if (-not (Test-Path $zip)) {
                throw "Download did not create $zip"
              }

              $zipItem = Get-Item $zip
              Write-Host "Downloaded file size: $($zipItem.Length) bytes"
              if ($zipItem.Length -le 0) {
                throw "Downloaded file is empty"
              }

              $archive = $null
              try {
                $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
                Write-Host "Validated ZIP archive entries: $($archive.Entries.Count)"
              } finally {
                if ($archive) {
                  $archive.Dispose()
                }
              }

              $downloaded = $true
              Write-Host "Selected zlib download URL: $url"
              break
            } catch {
              Write-Host "Failed to download or validate zlib from $url"
              Write-Host $_.Exception.Message
              Remove-Item -Path $zip -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not $downloaded) {
            throw "Could not download a valid zlib archive from any known source"
          }

          Remove-Item -Path $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          Expand-Archive -Path $zip -DestinationPath $extractRoot -Force

          $sourceCandidates = @()
          if ((Test-Path (Join-Path $extractRoot 'CMakeLists.txt')) -and (Test-Path (Join-Path $extractRoot 'zlib.h'))) {
            $sourceCandidates += (Get-Item $extractRoot)
          }
          $sourceCandidates += Get-ChildItem -Path $extractRoot -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              (Test-Path (Join-Path $_.FullName 'CMakeLists.txt')) -and
              (Test-Path (Join-Path $_.FullName 'zlib.h'))
            }

          $src = $sourceCandidates | Sort-Object FullName | Select-Object -First 1 -ExpandProperty FullName
          if (-not $src) {
            Write-Host "Extracted zlib archive directory listing:"
            Get-ChildItem -Path $extractRoot -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize | Out-String | Write-Host
            throw "Could not find a zlib source directory containing CMakeLists.txt and zlib.h under $extractRoot"
          }
          Write-Host "Discovered zlib source directory: $src"

          $bld = Join-Path $src "build"
          $zlibDir = Join-Path $bld "install"
          cmake -S "$src" -B "$bld" -G "NMake Makefiles" `
            -DCMAKE_INSTALL_PREFIX="$zlibDir" `
            -DCMAKE_BUILD_TYPE=Release `
            -DZLIB_BUILD_STATIC=ON `
            -DZLIB_BUILD_SHARED=OFF `
            -DZLIB_BUILD_TESTING=OFF `
            -DZLIB_INSTALL=ON
          cmake --build "$bld" --target install --config Release

          $inc = Join-Path $zlibDir "include"
          $libDir = Join-Path $zlibDir "lib"
          if (-not (Test-Path $libDir)) {
            $libDir = Join-Path $zlibDir "lib64"
          }
          if (-not (Test-Path $libDir)) {
            Write-Host "Installed zlib directory contents:"
            Get-ChildItem $zlibDir -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize | Out-String | Write-Host
            throw "Could not find a zlib library directory under $zlibDir"
          }
          $libCandidates = @(
            (Join-Path $libDir "zlib.lib"),
            (Join-Path $libDir "zlibstatic.lib"),
            (Join-Path $libDir "zs.lib")
          )
          # Optional fallback: any obvious static zlib lib from this static-only build; keep excluding z.lib.
          $extraStatic = Get-ChildItem -Path $libDir -Filter "*.lib" -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match '^(zlib.*|zs)\.lib$' -and
              $_.Name -notin @('z.lib')
            } |
            Select-Object -ExpandProperty FullName
          if ($extraStatic) {
            $libCandidates += $extraStatic
          }
          $static = $libCandidates | Where-Object { (Test-Path $_) -and ((Get-Item $_).Length -gt 0) } | Select-Object -First 1
          $lib = Join-Path $libDir "zlib.lib"
          if (-not $static) {
            Write-Host "Installed zlib lib directory contents:"
            Get-ChildItem $libDir | Format-Table -AutoSize | Out-String | Write-Host
            throw "Could not find a nonempty static zlib library. Tried: $($libCandidates -join ', ')"
          }
          $staticPath = [System.IO.Path]::GetFullPath($static)
          $libPath = [System.IO.Path]::GetFullPath($lib)
          if (-not [String]::Equals($staticPath, $libPath, [StringComparison]::OrdinalIgnoreCase)) {
            Copy-Item $staticPath $libPath -Force
          }

          if (-not (Test-Path (Join-Path $inc "zlib.h"))) {
            throw "zlib.h was not installed under $inc"
          }
          if ((-not (Test-Path $lib)) -or ((Get-Item $lib).Length -le 0)) {
            throw "Selected zlib library is missing or empty: $lib"
          }

          Write-Host "Final zlib include directory: $inc"
          Write-Host "Final zlib library directory: $libDir"
          Write-Host "Selected zlib static library: $lib"
          Write-Host "Selected zlib static library size: $((Get-Item $lib).Length) bytes"
          $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue
          if ($dumpbin) {
            Write-Host ("dumpbin headers for {0}:" -f $lib)
            try {
              dumpbin /headers $lib | Select-Object -First 80 | Out-String | Write-Host
            } catch {
              Write-Host "dumpbin /headers failed, continuing because this check is optional: $($_.Exception.Message)"
            }
          } else {
            Write-Host "dumpbin not found; skipping optional zlib.lib header inspection"
          }

          "CMAKE_PREFIX_PATH=$zlibDir;$env:CMAKE_PREFIX_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_INCLUDE_PATH=$inc;$env:CMAKE_INCLUDE_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_LIBRARY_PATH=$libDir;$env:CMAKE_LIBRARY_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZLIB_LIBRARY=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZLIB_INCLUDE_DIR=$inc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZLIB_LIBRARY_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZLIB_IS_STATIC=ON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$zlibDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Eigen
        shell: pwsh
        run: |
          $ver = '3.4.0'
          $zip = "$env:RUNNER_TEMP\eigen.zip"
          Invoke-WebRequest "https://gitlab.com/libeigen/eigen/-/archive/$ver/eigen-$ver.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP "eigen-$ver"
          "EIGEN3_INCLUDE_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$dir;$env:CMAKE_PREFIX_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build libxml2
        shell: pwsh
        run: |
          $ver = '2.12.10'
          $zip = "$env:RUNNER_TEMP\libxml2.zip"
          Invoke-WebRequest "https://github.com/GNOME/libxml2/archive/refs/tags/v$ver.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $src = Join-Path $env:RUNNER_TEMP "libxml2-$ver"
          $installDir = Join-Path $src 'install'
          $win32 = Join-Path $src 'win32'
          Push-Location $win32
          cscript configure.js compiler=msvc prefix=$installDir iconv=no zlib=yes include=$env:ZLIB_INCLUDE_DIR lib=$env:ZLIB_LIBRARY_DIR
          (Get-Content Makefile.msvc).Replace('/OPT:NOWIN98','').Replace('zdll.lib','zlib.lib') | Set-Content Makefile.msvc
          $conf = Join-Path $src 'config.h'
          if (Test-Path $conf) {
            (Get-Content $conf) -replace '^#define snprintf.*', '// removed snprintf define' -replace '^#define vsnprintf.*', '// removed vsnprintf define' | Set-Content $conf
          }
          nmake /f Makefile.msvc
          nmake /f Makefile.msvc install
          Pop-Location
          Write-Host "libxml2 library path after install:" $installDir
          $inc = Join-Path $installDir 'include'
          $lib = Join-Path $installDir 'lib' 'libxml2.lib'
          "CMAKE_PREFIX_PATH=$installDir;$env:CMAKE_PREFIX_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBXML2_LIBRARY=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBXML2_LIBRARIES=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBXML2_INCLUDE_DIR=$inc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          $qtDir = "C:\\Qt"
          python -m aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 -O $qtDir
          $qt = "$qtDir\6.6.3\msvc2019_64"
          Write-Host "Qt root: $qt"
          Get-ChildItem "$qt\bin" | Select-Object -First 40 | Format-Table -AutoSize
          foreach ($tool in @('moc.exe', 'uic.exe', 'rcc.exe')) {
            $toolPath = Join-Path "$qt\bin" $tool
            if (!(Test-Path $toolPath)) {
              throw "Required Qt tool not found: $toolPath"
            }
            Write-Host "Found Qt tool: $toolPath"
          }
          foreach ($tool in @('qmake.exe', 'lrelease.exe', 'lupdate.exe')) {
            $toolPath = Join-Path "$qt\bin" $tool
            if (Test-Path $toolPath) {
              Write-Host "Found optional Qt tool: $toolPath"
            } else {
              Write-Host "Optional Qt tool not found: $toolPath"
            }
          }
          "Qt6_DIR=$qt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$qt;$env:CMAKE_PREFIX_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$qt\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build GLEW
        shell: pwsh
        run: |
          $ver = '2.2.0'
          $zip = "$env:RUNNER_TEMP\glew.zip"
          Invoke-WebRequest "https://github.com/nigels-com/glew/releases/download/glew-$ver/glew-$ver.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $glewDir = Join-Path $env:RUNNER_TEMP "glew-$ver"
          $buildDir = Join-Path $glewDir 'builddir'
          cmake -S (Join-Path $glewDir 'build' 'cmake') -B $buildDir -G "NMake Makefiles" -DBUILD_SHARED_LIBS=ON -DBUILD_UTILS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$buildDir\install"
          cmake --build $buildDir --config Release --target install
          $installDir = Join-Path $buildDir 'install'
          $binDir = Join-Path $installDir 'bin'
          $libDir = Join-Path $installDir 'lib'
          $inc = Join-Path $installDir 'include'
          "GLEW_BIN_DIR=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GLEW_INCLUDE_DIR=$inc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GLEW_LIBRARY=$(Join-Path $libDir 'glew32.lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_INCLUDE_PATH=$inc;$env:CMAKE_INCLUDE_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_LIBRARY_PATH=$libDir;$env:CMAKE_LIBRARY_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$installDir;$env:CMAKE_PREFIX_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Boost
        shell: pwsh
        run: |
          choco install boost-msvc-14.3 --version=1.87.0 -y --no-progress
          $boostRoot = 'C:\local\boost_1_87_0'
          $boostInclude = 'C:\local\boost_1_87_0'
          $boostLibDir = 'C:\local\boost_1_87_0\lib64-msvc-14.3'
          if (-not (Test-Path $boostRoot)) {
            throw "BOOST_ROOT path not found: $boostRoot"
          }
          if (-not (Test-Path (Join-Path $boostRoot 'boost\version.hpp'))) {
            throw "Boost headers not found at $(Join-Path $boostRoot 'boost\\version.hpp')"
          }
          if (-not (Test-Path $boostLibDir)) {
            throw "BOOST_LIBRARYDIR path not found: $boostLibDir"
          }
          "BOOST_ROOT=$boostRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOST_INCLUDEDIR=$boostInclude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOST_LIBRARYDIR=$boostLibDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Boost_NO_SYSTEM_PATHS=ON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$boostRoot;$env:CMAKE_PREFIX_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_INCLUDE_PATH=$boostInclude;$env:CMAKE_INCLUDE_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_LIBRARY_PATH=$boostLibDir;$env:CMAKE_LIBRARY_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$boostLibDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $boostDlls = Get-ChildItem -Path $boostLibDir -Filter "boost_*.dll" -ErrorAction SilentlyContinue
          if ($boostDlls) {
            Write-Host "Discovered Boost DLLs:" ($boostDlls | ForEach-Object { $_.Name } | Join-String -Separator ", ")
          } else {
            Write-Host "No boost_*.dll files found yet under $boostLibDir"
          }
      - name: Configure
        shell: pwsh
        env:
          ENABLE_TESTS: ${{ matrix.target == 'tests' && 'ON' || 'OFF' }}
        run: |
          $dist = Join-Path $pwd 'scripts/installer/dist'
          cmake -S . -B build `
            -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_VERBOSE_MAKEFILE=ON `
            "-DENABLE_TESTS=$env:ENABLE_TESTS" `
            -DENABLE_OPENMP=ON `
            -DCMAKE_INSTALL_PREFIX="$dist" `
            -DENABLE_AVO_PACKAGE=ON `
            -DENABLE_GLSL=OFF `
            "-DBOOST_ROOT=$env:BOOST_ROOT" `
            "-DBOOST_INCLUDEDIR=$env:BOOST_INCLUDEDIR" `
            "-DBOOST_LIBRARYDIR=$env:BOOST_LIBRARYDIR" `
            "-DBoost_NO_SYSTEM_PATHS=$env:Boost_NO_SYSTEM_PATHS" `
            "-DEIGEN3_INCLUDE_DIR=$env:EIGEN3_INCLUDE_DIR" `
            "-DLIBXML2_LIBRARY=$env:LIBXML2_LIBRARY" `
            "-DLIBXML2_INCLUDE_DIR=$env:LIBXML2_INCLUDE_DIR" `
            "-DGLEW_INCLUDE_DIR=$env:GLEW_INCLUDE_DIR" `
            "-DGLEW_LIBRARY=$env:GLEW_LIBRARY"
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target openbabel_ext
          $coordgenDir = "$PWD\build\openbabel-install\bin"
          if (-not (Test-Path $coordgenDir)) {
            throw "OpenBabel runtime directory not found: $coordgenDir"
          }
          $coordgenDlls = Get-ChildItem -Path $coordgenDir -Filter "coordgen*.dll" -ErrorAction SilentlyContinue
          if (-not $coordgenDlls) {
            Get-ChildItem -Path $coordgenDir | Format-Table -AutoSize
            throw "CoordGen DLL not found under $coordgenDir"
          }
          Write-Host "CoordGen DLLs found:" ($coordgenDlls | ForEach-Object { $_.Name } | Join-String -Separator ", ")
          $boostDlls = Get-ChildItem -Path $env:BOOST_LIBRARYDIR -Filter "boost_*.dll" -ErrorAction Stop
          if (-not $boostDlls) {
            throw "No Boost DLLs found under $env:BOOST_LIBRARYDIR"
          }
          foreach ($dll in $boostDlls) {
            Copy-Item -Path $dll.FullName -Destination $coordgenDir -Force
          }
          Write-Host "Boost DLLs copied to ${coordgenDir}:" ($boostDlls | ForEach-Object { $_.Name } | Join-String -Separator ", ")
          cmake --build build --config Release --target install
      - name: Download + stage xTB runtime (OpenSpec 5.1/5.2)
        # Bundles the pinned xTB conda-forge win-64 runtime next to avogadro.exe
        # so the QLibrary shim resolves libxtb-6.dll exactly like an installed
        # user, plus the GFN-FF parameter data and each component's license text.
        # Runs on BOTH matrix targets so the installer package and the ctest leg
        # share the staged dist\bin (design D2).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Stage into a dedicated dir (NOT dist/bin): create_installer.py wipes
          # and rebuilds dist, then copies the xTB runtime into dist/bin from
          # XTB_STAGING_DIR before makensis (design D2). The tests leg points
          # PATH at this staging dir too.
          $dist = "$PWD\scripts\installer\dist"
          $stageRoot = "$PWD\scripts\installer\xtb-stage"
          $binDir = Join-Path $stageRoot 'bin'
          $shareXtb = Join-Path $binDir 'share\xtb'
          $licDir = Join-Path $binDir 'licenses\xtb'
          New-Item -ItemType Directory -Force $binDir, $shareXtb, $licDir | Out-Null

          $artifacts = $env:XTB_ARTIFACTS | ConvertFrom-Json
          $hosts = @(
            'https://conda.anaconda.org/conda-forge/win-64',
            'https://repo.conda-forge.org/win-64'
          )
          $tempDir = Join-Path $env:RUNNER_TEMP 'xtb-artifacts'
          New-Item -ItemType Directory -Force $tempDir | Out-Null

          foreach ($a in $artifacts) {
            $fn = $a.fn
            $dst = Join-Path $tempDir $fn
            $downloaded = $false
            foreach ($h in $hosts) {
              $url = "$h/$fn"
              try {
                Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing -ErrorAction Stop
                $downloaded = $true
                Write-Host "Downloaded $fn from $h"
                break
              } catch {
                Write-Host "  $h failed: $($_.Exception.Message)"
                Remove-Item $dst -ErrorAction SilentlyContinue
              }
            }
            if (-not $downloaded) { throw "Could not download $fn from any host" }

            $actual = (Get-FileHash -Path $dst -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $a.sha256.ToLower()) {
              throw "SHA256 mismatch for ${fn}: expected $($a.sha256.ToLower()) got $actual"
            }
            Write-Host "Verified sha256 for $fn"

            # .conda is a zip of info-*.tar.zst + pkg-*.tar.zst. Extract both.
            $unzip = Join-Path $tempDir ('unzip-{0}' -f $fn)
            New-Item -ItemType Directory -Force $unzip | Out-Null
            Expand-Archive -Path $dst -DestinationPath $unzip -Force
            $infoTar = Get-ChildItem -Path $unzip -Filter 'info-*.tar.zst' | Select-Object -First 1
            $pkgTar = Get-ChildItem -Path $unzip -Filter 'pkg-*.tar.zst' | Select-Object -First 1
            if (-not $infoTar -or -not $pkgTar) { throw "No pkg/info tar.zst in $fn" }
            $infoExt = Join-Path $tempDir ('infoextr-{0}' -f $fn)
            $pkgExt = Join-Path $tempDir ('pkgextr-{0}' -f $fn)
            New-Item -ItemType Directory -Force $infoExt, $pkgExt | Out-Null
            tar --zstd -xf $infoTar.FullName -C $infoExt
            tar --zstd -xf $pkgTar.FullName -C $pkgExt

            # DLLs -> dist\bin
            $binSrc = Join-Path $pkgExt 'Library\bin'
            $dlls = Get-ChildItem -Path $binSrc -Filter '*.dll' -ErrorAction SilentlyContinue
            foreach ($dll in $dlls) { Copy-Item -Path $dll.FullName -Destination $binDir -Force }
            Write-Host "Staged $($dlls.Count) DLL(s) from $fn"

            # GFN-FF parameter data -> dist\bin\share\xtb. The relative path
            # must be from $parSrc (not $pkgExt) so .param_gfnff.xtb lands
            # directly in $shareXtb, where the locator probes it.
            $parSrc = Join-Path $pkgExt 'Library\share\xtb'
            if (Test-Path $parSrc) {
              Get-ChildItem -Path $parSrc -Recurse -File |
                ForEach-Object {
                  $rel = $_.FullName.Substring($parSrc.Length + 1)
                  $dest = Join-Path $shareXtb $rel
                  New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
                  Copy-Item -Path $_.FullName -Destination $dest -Force
                }
              Write-Host "Staged GFN-FF parameter data from $fn"
            }

            # Licenses -> dist\licenses\xtb\<pkg> (only when the artifact ships
            # license text; conda-forge ships it inconsistently across packages).
            $licSrc = Join-Path $infoExt 'info\licenses'
            $licFiles = Get-ChildItem -Path $licSrc -File -Recurse -ErrorAction SilentlyContinue
            if ($licFiles.Count -gt 0) {
              $licDst = Join-Path $licDir $a.pkg
              New-Item -ItemType Directory -Force $licDst | Out-Null
              Copy-Item -Path $licSrc -Destination $licDst -Recurse -Force
              Write-Host "Staged licenses from $fn"
            }
          }

          $paramFile = Join-Path $shareXtb '.param_gfnff.xtb'
          if (-not (Test-Path $paramFile)) {
            throw "GFN-FF parameter file not staged at $paramFile"
          }
          $licPkgCount = (Get-ChildItem -Path $licDir -Directory -ErrorAction SilentlyContinue |
            Where-Object { (Get-ChildItem $_.FullName -File -Recurse -ErrorAction SilentlyContinue).Count -gt 0 }).Count
          Write-Host "xTB staging complete: param file present, $licPkgCount license dirs with files"
          if ($licPkgCount -lt 3) { throw "Expected >= 3 license dirs with files under $licDir, found $licPkgCount" }
      - name: Verify xTB DLL closure (fixpoint) (OpenSpec 5.1)
        # Walk libxtb-6.dll's imports to a fixpoint with dumpbin and fail if any
        # imported non-system, non-API-set DLL is absent from the staged set
        # (design D2: full transitive closure present). Runs on the installer leg.
        if: matrix.target == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The xTB runtime is staged into xtb-stage\bin and copied into the
          # packaged dist\bin by create_installer.py; verify the closure on the
          # staged set (same DLLs that end up in the installer).
          $binDir = Join-Path "$PWD\scripts\installer\xtb-stage" 'bin'
          if (-not (Get-Command dumpbin -ErrorAction SilentlyContinue)) {
            throw "dumpbin not found on PATH; cannot inspect DLL imports"
          }
          $stagedSet = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($d in (Get-ChildItem -Path $binDir -Filter '*.dll')) {
            [void]$stagedSet.Add($d.Name.ToLower())
          }
          $systemAllow = @(
            'kernel32.dll','user32.dll','gdi32.dll','advapi32.dll','shell32.dll',
            'shell32.dll','comctl32.dll','ole32.dll','oleaut32.dll','uuid.dll',
            'msvcrt.dll','ucrtbase.dll','ntdll.dll','winmm.dll','imm32.dll',
            'mswsock.dll','ws2_32.dll','gdi32.dll'
          )
          function Test-ImportAllowed { param([string]$Name)
            $n = $Name.ToLower()
            if ($n -match '^api-ms-') { return $true }
            return [bool]($systemAllow -contains $n)
          }
          $worklist = [System.Collections.Generic.Queue[string]]::new()
          $visited = [System.Collections.Generic.HashSet[string]]::new()
          $root = 'libxtb-6.dll'
          if (-not ($stagedSet -contains $root)) { throw "libxtb-6.dll not staged in $binDir" }
          [void]$worklist.Enqueue($root)
          $errors = [System.Collections.Generic.List[string]]::new()
          while ($worklist.Count -gt 0) {
            $name = $worklist.Dequeue()
            if (-not ($visited.Add($name))) { continue }
            $deps = dumpbin /dependents (Join-Path $binDir $name) 2>$null | Out-String
            # dumpbin /dependents lists one dependency per line with the DLL name
            # at the start of the line (mirror of create_installer.py's parser).
            $imported = $deps -split "\r?\n" | ForEach-Object {
              $tok = [System.IO.Path]::GetFileName($_.Trim())
              if ($tok -match '(?i)\.(dll|exe)$') { $tok }
            }
            foreach ($imp in $imported) {
              if (-not $imp) { continue }
              if (Test-ImportAllowed -Name $imp) { continue }
              if (-not ($stagedSet -contains $imp.ToLower())) {
                [void]$errors.Add("$name imports $imp which is not staged")
              } elseif (-not ($visited -contains $imp.ToLower())) {
                [void]$worklist.Enqueue($imp.ToLower())
              }
            }
          }
          if ($errors.Count -gt 0) {
            Write-Host "xTB DLL closure failures:"
            $errors | ForEach-Object { Write-Host "  $_" }
            throw "$($errors.Count) missing xTB closure DLL(s)"
          }
          Write-Host "xTB DLL closure verified to fixpoint ($($visited.Count) DLLs inspected)"
      - name: Verify GPU-preference symbol exports (force-dedicated-gpu)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path 'scripts\installer\dist\bin' 'avogadro.exe'
          if (-not (Test-Path $exe)) {
            throw "avogadro.exe not found at $exe"
          }
          if (-not (Get-Command dumpbin -ErrorAction SilentlyContinue)) {
            throw "dumpbin not found on PATH; cannot verify exports"
          }
          $exports = dumpbin /exports $exe | Out-String
          Write-Host $exports
          $required = @('NvOptimusEnablement', 'AmdPowerXpressRequestHighPerformance')
          $missing = @()
          foreach ($sym in $required) {
            if (-not ($exports -match [regex]::Escape($sym))) {
              $missing += $sym
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing expected GPU-preference exports: $($missing -join ', ')"
          }
          Write-Host "GPU-preference exports present: $($required -join ', ')"
      - name: Create installer
        if: matrix.target == 'installer'
        shell: pwsh
        run: |
          $env:OPENBABEL_INSTALL_DIR = "$PWD\build\openbabel-install"
          # create_installer.py rebuilds dist from scratch and copies the xTB
          # runtime into dist/bin from XTB_STAGING_DIR before makensis.
          $env:XTB_STAGING_DIR = "$PWD\scripts\installer\xtb-stage"
          python scripts/installer/create_installer.py
      - name: Capture live renderer log (OpenSpec 3.1)
        # Runs AFTER the packaged tree is assembled (create_installer.py) so the
        # smoke run exercises the actual shipped dist\bin, including the
        # dependency-closure gate and Qt-module top-up. Polls for the startup
        # banner and classifies the outcome (OpenSpec: windows-installer-runtime
        # "CI smoke run exercises the packaged runtime"). Never Stop-Process
        # before the captured log has been read.
        if: matrix.target == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path 'scripts\installer\dist\bin' 'avogadro.exe'
          if (-not (Test-Path $exe)) {
            throw "avogadro.exe not found at $exe; cannot smoke-run the packaged app"
          }
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $errLog = "$PWD\renderer_stderr.log"
          $outLog = "$PWD\renderer_stdout.log"
          Remove-Item $errLog, $outLog -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardError $errLog -RedirectStandardOutput $outLog -WindowStyle Hidden
          Write-Host "Launched avogadro.exe (pid $($proc.Id)); polling startup log up to 20s..."

          $deadline = [DateTime]::Now.AddSeconds(20)
          while ([DateTime]::Now -lt $deadline -and -not $proc.HasExited) {
            try { $proc.Refresh() } catch {}
            Start-Sleep -Milliseconds 250
          }

          # Read BOTH logs BEFORE killing anything (never Stop-Process first).
          $err = if (Test-Path $errLog) { Get-Content $errLog -Raw } else { '' }
          $out = if (Test-Path $outLog) { Get-Content $outLog -Raw } else { '' }
          $banner = $err + "`n" + $out
          $hasBanner = $banner -match 'Avogadro version:'
          $hasRenderer = $banner -match 'OpenGL renderer:'
          $headlessFatal = $banner -match 'No rendering tier can run on this system'
          $stillRunning = -not $proc.HasExited

          Write-Host "----- renderer_stderr.log (first 60 lines) -----"
          ($err -split "`n" | Select-Object -First 60) -join "`n" | Write-Host
          Write-Host "----- renderer_stdout.log (first 20 lines) -----"
          ($out -split "`n" | Select-Object -First 20) -join "`n" | Write-Host

          if ($hasBanner -and ($hasRenderer -or $headlessFatal)) {
            if ($hasRenderer) {
              Write-Host "SMOKE PASS: startup banner + OpenGL renderer line observed."
            } else {
              Write-Host "SMOKE PASS: startup banner observed; headless runner reported the known"
              Write-Host "            'No rendering tier can run' qFatal limitation (documented outcome)."
            }
          } elseif ($hasBanner) {
            # Banner printed but no renderer/headless line. If the app is still
            # running this is a healthy-with-note; if it exited without either,
            # it is suspicious but not the 'never started' regression, so warn.
            if ($stillRunning) {
              Write-Host "SMOKE PASS (note): banner observed, process still alive, no renderer line yet."
            } else {
              Write-Host "SMOKE WARN: banner observed but process exited without a renderer line or the"
              Write-Host "            documented headless qFatal message; review the captured logs above."
            }
          } elseif ($stillRunning) {
            # Alive at the deadline without a banner: healthy-with-note per design.
            Write-Host "SMOKE PASS (note): process still alive at 20s deadline without a banner yet."
          } else {
            # Exited before producing the banner with (likely) no useful output.
            Write-Host "SMOKE FAIL: process exited before emitting the startup banner."
            Write-Host "----- captured stderr (full) -----"
            $err | Write-Host
            Write-Host "----- captured stdout (full) -----"
            $out | Write-Host
            throw "Packaged app exited before the startup banner with no usable output (see captured logs above)."
          }

          if (-not $stillRunning) {
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
          }
      - name: Verify xTB library resolves (OpenSpec 5.3)
        # The bundled libxtb-6.dll must load and export the C API entry point the
        # application calls, exactly like an installed user machine. Installer leg.
        if: matrix.target == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Language CSharp -Namespace XtbSmoke -Name Loader -MemberDefinition @'
            [System.Runtime.InteropServices.DllImport("kernel32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode, SetLastError = true)]
            public static extern IntPtr LoadLibraryW(string lpFileName);
            [System.Runtime.InteropServices.DllImport("kernel32.dll")]
            public static extern IntPtr GetProcAddress(IntPtr hModule, string lpProcName);
            [System.Runtime.InteropServices.DllImport("kernel32.dll", SetLastError = true)]
            [return: System.Runtime.InteropServices.MarshalAs(System.Runtime.InteropServices.UnmanagedType.Bool)]
            public static extern bool SetDllDirectory(string lpPathName);
          '@
          $binDir = Join-Path "$PWD\scripts\installer\dist" 'bin'
          $lib = Join-Path $binDir 'libxtb-6.dll'
          if (-not (Test-Path $lib)) { throw "libxtb-6.dll not staged at $lib" }
          # Put the staged bin dir on the DLL search path so libxtb-6.dll's own
          # dependencies (libgfortran-5.dll, libgomp-1.dll, openblas.dll, ...)
          # resolve exactly like an installed user machine where the app and the
          # xTB runtime share one directory.
          $null = [XtbSmoke.Loader]::SetDllDirectory($binDir)
          $env:PATH = "$binDir;$env:PATH"
          # Diagnostic: list what's actually staged, then load each direct
          # dependency individually so a resolution failure names the DLL.
          $dlls = Get-ChildItem -Path $binDir -Filter '*.dll'
          Write-Host "Staged $(@($dlls).Count) DLLs in ${binDir}:"
          foreach ($d in $dlls) { Write-Host "  $($d.Name)" }
          $deps = dumpbin /dependents $lib 2>$null | Out-String
          $impNames = $deps -split "\r?\n" | ForEach-Object {
            $tok = [System.IO.Path]::GetFileName($_.Trim())
            if ($tok -match '(?i)\.(dll|exe)$') { $tok }
          }
          foreach ($dep in $impNames) {
            if ($dep -match '(?i)^(kernel32|api-ms-|user32|ntdll|ucrtbase|vcruntime|msvcp)') { continue }
            $depPath = Join-Path $binDir $dep
            if (-not (Test-Path $depPath)) {
              Write-Host "MISSING dependency: $dep (not in $binDir)"
              continue
            }
            $h = [XtbSmoke.Loader]::LoadLibraryW($depPath)
            if ([System.IntPtr]::Equals($h, [System.IntPtr]::Zero)) {
              Write-Host "FAILED to load dependency: $dep, GetLastError=$([System.Runtime.InteropServices.Marshal]::GetLastWin32Error())"
            } else {
              Write-Host "Loaded dependency: $dep"
            }
          }
          $hmod = [XtbSmoke.Loader]::LoadLibraryW($lib)
          if ([System.IntPtr]::Equals($hmod, [System.IntPtr]::Zero)) {
            throw "LoadLibraryW($lib) failed, GetLastError=$([System.Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }
          $entry = [XtbSmoke.Loader]::GetProcAddress($hmod, 'xtb_newEnvironment')
          if ([System.IntPtr]::Equals($entry, [System.IntPtr]::Zero)) {
            throw "GetProcAddress(libxtb-6.dll, xtb_newEnvironment) failed, GetLastError=$([System.Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }
          Write-Host "xTB smoke OK: libxtb-6.dll loaded, xtb_newEnvironment exported"
      - name: Verify bundled OpenBabel runtime (installer)
        if: matrix.target == 'installer'
        shell: pwsh
        run: |
          $dist = "$PWD\scripts\installer\dist"
          $required = @(
            "$dist\bin\openbabel-3.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required runtime file: $path"
            }
          }

          $libxml = Get-ChildItem -Path "$dist\bin" -Filter "libxml2*.dll" -ErrorAction SilentlyContinue
          if (-not $libxml) {
            throw "Missing libxml2 runtime DLL in $dist\bin"
          }
          Write-Host "libxml2 runtime DLL(s):" ($libxml | ForEach-Object { $_.Name } | Join-String -Separator ", ")

          $pluginRoots = Get-ChildItem -Path "$dist\lib\openbabel" -Directory -ErrorAction SilentlyContinue
          if (-not $pluginRoots) {
            throw "No OpenBabel plugin root found in $dist\lib\openbabel"
          }
          $xmlPlugin = $null
          $descriptorPlugin = $null
          foreach ($root in $pluginRoots) {
            $candidateXml = Join-Path $root.FullName "formats_xml.obf"
            if ((-not $xmlPlugin) -and (Test-Path $candidateXml)) {
              $xmlPlugin = $candidateXml
            }

            $candidateDescriptors = Join-Path $root.FullName "plugin_descriptors.obf"
            if ((-not $descriptorPlugin) -and (Test-Path $candidateDescriptors)) {
              $descriptorPlugin = $candidateDescriptors
            }
          }
          if (-not $xmlPlugin) {
            throw "Missing formats_xml.obf in $dist\lib\openbabel\<version>"
          }
          Write-Host "Found XML format plugin artifact:" $xmlPlugin
          if ($descriptorPlugin) {
            Write-Host "Found OpenBabel descriptor plugin artifact:" $descriptorPlugin
          } else {
            Write-Host "plugin_descriptors.obf not found (continuing)."
          }

          $pluginRoot = Split-Path $xmlPlugin -Parent
          $versionDir = Split-Path $pluginRoot -Leaf
          $dataDir = Join-Path $dist "share\openbabel\$versionDir"
          if (-not (Test-Path $dataDir)) {
            throw "Missing OpenBabel data directory for version '$versionDir': $dataDir"
          }
      - name: Probe packaged OpenBabel runtime (installer)
        if: matrix.target == 'installer'
        shell: pwsh
        run: |
          python scripts/installer/probe_openbabel_runtime.py scripts\installer\dist
      - name: Diagnose xTB load (tests leg)
        if: matrix.target == 'tests'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Language CSharp -Namespace XtbDiag -Name Loader -MemberDefinition @'
            [System.Runtime.InteropServices.DllImport("kernel32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr LoadLibraryW(string lpFileName);
            [System.Runtime.InteropServices.DllImport("kernel32.dll")]
            public static extern IntPtr GetProcAddress(IntPtr hModule, string lpProcName);
            [System.Runtime.InteropServices.DllImport("kernel32.dll", SetLastError=true)]
            [return: System.Runtime.InteropServices.MarshalAs(System.Runtime.InteropServices.UnmanagedType.Bool)]
            public static extern bool SetDllDirectory(string lpPathName);
          '@
          $binDir = Join-Path "$PWD\scripts\installer\xtb-stage" 'bin'
          if (-not (Test-Path $binDir)) { throw "staged bin dir missing: $binDir" }
          # Put the staged bin dir on the DLL search path so forwarder targets
          # (openblas.dll) and other same-dir dependencies resolve, exactly like
          # an installed user machine where the xTB runtime shares the app dir.
          $null = [XtbDiag.Loader]::SetDllDirectory($binDir)
          $env:PATH = "$binDir;$env:PATH"
          $dlls = Get-ChildItem -Path $binDir -Filter '*.dll'
          Write-Host "$(@($dlls).Count) DLLs staged; loading libxtb-6.dll (its deps resolve from $binDir)"
          # Load libxtb-6.dll once and keep it loaded (no FreeLibrary cycle).
          # Loading and unloading the gfortran/OpenMP runtime repeatedly trips a
          # fail-fast (STATUS_STACK_BUFFER_OVERRUN), so we load once and inspect
          # the export, then let the process exit and Windows clean up.
          $lib = Join-Path $binDir 'libxtb-6.dll'
          if (-not (Test-Path $lib)) { throw "libxtb-6.dll not staged" }
          $h = [XtbDiag.Loader]::LoadLibraryW($lib)
          if ($h -eq [IntPtr]::Zero) {
            $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
            Write-Host "  FAIL load libxtb-6.dll (err=$err)"
            Write-Host "  ERROR_ENVVAR_NOT_FOUND=203  ERROR_MOD_NOT_FOUND=126"
          } else {
            $entry = [XtbDiag.Loader]::GetProcAddress($h, 'xtb_newEnvironment')
            if ($entry -eq [IntPtr]::Zero) {
              Write-Host "  FAIL GetProcAddress(libxtb-6.dll, xtb_newEnvironment)"
            } else {
              Write-Host "  libxtb-6.dll loads OK, xtb_newEnvironment exported"
            }
          }
      - name: Test
        if: matrix.target == 'tests'
        shell: pwsh
        run: |
          # Prepend the staged xTB runtime dir (xtb-stage\bin) and the OpenBabel
          # runtime so QLibrary resolves libxtb-6.dll exactly like an installed
          # user machine (OpenSpec 5.4). The tests leg does not run
          # create_installer.py, so the xTB DLLs live in xtb-stage here.
          $stagedBin = "$PWD\scripts\installer\xtb-stage\bin"
          $env:PATH = "$stagedBin;$PWD\build\openbabel-install\bin;$env:PATH"
          # Headless runner: QOpenGLContext::create() succeeds but yields a
          # GDI Generic OpenGL 1.1 context (no real rendering). Force the
          # offscreen platform so GL backends can't initialise and every
          # GL-dependent test's guard skips cleanly instead of crashing,
          # hanging, or aborting. Headless emission-level parity is still
          # covered by threadedparitytest.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          ctest --test-dir build -C Release --output-on-failure
          Write-Host "`n=== xtbengineTest verbose (slot-level) ==="
          & .\build\bin\xtbenginetest.exe -v2 2>&1 | Select-Object -First 80
      - name: Upload installer
        if: matrix.target == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: avogadro-windows-installer
          path: |
            scripts/installer/avogadro-win64-*.exe
          if-no-files-found: error
